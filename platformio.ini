; Soil Sensor — PlatformIO Configuration
;
; First:           cp src/secrets.example.h src/secrets.h   (then edit it)
; Build & upload:  pio run -e soil-1 -t upload
; Serial monitor:  pio device monitor
; I2C scanner:     pio run -e scanner -t upload
; Compile check:   pio run -e soil-T    (no -t upload = compile only)
; Unit tests:      pio test -e native

[env]
monitor_speed = 115200

; ─── ESP32 base settings ────────────────────────────────
[esp32_base]
; pioarduino fork required for ESP32-C6 Arduino framework support
; (stock espressif32 platform doesn't support Arduino on C6 yet)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
; Arduino ESP32 3.x WiFi depends on Network but doesn't declare it.
; get_network_flags.py outputs -I flags for the missing framework libraries.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    !python3 get_network_flags.py

[sensor_common]
extends = esp32_base
upload_speed = 921600
lib_ldf_mode = chain+
extra_scripts = post:fix_wifi_deps.py
lib_deps =
    adafruit/Adafruit seesaw Library@^1.7.8
    adafruit/Adafruit SHT4x Library@^1.0.4
    sensirion/Sensirion I2C SCD4x@^0.4.0
    miceuz/I2CSoilMoistureSensor@^1.1.5

; ─── Device-specific environments ─────────────────────────
; Build a specific device:  pio run -e soil-1 -t upload
;                           pio run -e soil-2 -t upload
;                           pio run -e soil-T -t upload
;
; soil-1  Custom build: STEMMA I2C soil + SHT41 + SCD-41, LiPo/solar, MOSFET power gating
; soil-2  Seeed pre-built garden sensor: analog capacitive only, AA batteries, no CO2
; soil-T  Testbed unit: same sensors as soil-1, USB-powered on the bench

[env:soil-1]
extends = sensor_common

[env:soil-2]
; Seeed pre-built garden sensor
; Analog capacitive soil moisture (ADC, no STEMMA I2C)
; AA batteries — no solar, no adaptive sleep
extends = sensor_common
build_flags =
    ${esp32_base.build_flags}
    -DDEVICE_ID=\"soil-2\"
    -DDEVICE_LOCATION=\"Garden\"
    -DDEVICE_HOSTNAME=\"SoilSensor-002\"
    -DANALOG_SOIL=true
    -DSCD41_ENABLED=false
    -DSOLAR_ENABLED=false
    -DFIXED_SLEEP_MIN=30
    -DBATTERY_R1=1.0f
    -DBATTERY_R2=1.0f
    -DBATTERY_FULL_V=1.5f
    -DBATTERY_EMPTY_V=0.9f

[env:soil-T]
; Testbed unit — USB-powered, same sensor suite as soil-1
; Used for development and testing on the bench
extends = sensor_common
build_flags =
    ${esp32_base.build_flags}
    -DDEVICE_ID=\"soil-T\"
    -DDEVICE_HOSTNAME=\"SoilSensor-T\"
    -DDEVICE_LOCATION=\"Test\"

; ─── Sensor comparison test environments ──────────────────
; Three identical XIAO ESP32-C6 boards, each with one sensor type,
; USB-powered, 30s intervals. Indoor side-by-side comparison test.

[env:soil-test-seeed]
; Seeed XIAO analog capacitive soil sensor (ADC)
extends = sensor_common
build_flags =
    ${esp32_base.build_flags}
    -DDEVICE_ID=\"test-seeed\"
    -DDEVICE_LOCATION=\"Sensor\ Test\"
    -DDEVICE_HOSTNAME=\"SoilTest-Seeed\"
    -DANALOG_SOIL=true
    -DSCD41_ENABLED=false
    -DSOLAR_ENABLED=false
    -DFORCE_USB_MODE=true

[env:soil-test-stemma]
; Adafruit STEMMA I2C capacitive soil sensor (0x36)
extends = sensor_common
build_flags =
    ${esp32_base.build_flags}
    -DDEVICE_ID=\"test-stemma\"
    -DDEVICE_LOCATION=\"Sensor\ Test\"
    -DDEVICE_HOSTNAME=\"SoilTest-STEMMA\"
    -DSCD41_ENABLED=false
    -DSOLAR_ENABLED=false
    -DFORCE_USB_MODE=true

[env:soil-test-catnip]
; Catnip/Chirp I2C capacitive soil sensor (0x20)
extends = sensor_common
build_flags =
    ${esp32_base.build_flags}
    -DDEVICE_ID=\"test-catnip\"
    -DDEVICE_LOCATION=\"Sensor\ Test\"
    -DDEVICE_HOSTNAME=\"SoilTest-Catnip\"
    -DCATNIP_SOIL=true
    -DSCD41_ENABLED=false
    -DSOLAR_ENABLED=false
    -DFORCE_USB_MODE=true

[env:scanner]
extends = esp32_base
build_src_filter = -<*> +<../tools/i2c_scanner.cpp>

; ─── Native test environment ────────────────────────────
; Runs unit tests on host (no hardware needed).
; Usage:  pio test -e native
[env:native]
platform = native
build_flags =
    -std=c++17
    -DUNIT_TEST
test_framework = unity
