; Soil Sensor — PlatformIO Configuration
;
; First:           cp src/secrets.example.h src/secrets.h   (then edit it)
; Build & upload:  pio run -t upload
; Serial monitor:  pio device monitor
; I2C scanner:     pio run -e scanner -t upload
; Compile check:   pio run            (no -t upload = compile only)
; Unit tests:      pio test -e native

[platformio]
default_envs = soil-sensor

[env]
monitor_speed = 115200

; ─── ESP32 base settings ────────────────────────────────
[esp32_base]
; pioarduino fork required for ESP32-C6 Arduino framework support
; (stock espressif32 platform doesn't support Arduino on C6 yet)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
; Arduino ESP32 3.x WiFi depends on Network but doesn't declare it.
; get_network_flags.py outputs -I flags for the missing framework libraries.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    !python3 get_network_flags.py

; ─── Production firmware ──────────────────────────────────
; Catnip/Chirp I2C probe, LiPo + solar, MOSFET sensor power gating:
; the hardware built in docs/assembly-guide.pdf. Defaults live in src/config.h.
;
; Give each node its own identity by adding to build_flags, e.g.:
;     -DDEVICE_ID=\"soil-2\"
;     -DDEVICE_HOSTNAME=\"SoilSensor-002\"
;     -DDEVICE_LOCATION=\"Raised\ Bed\"
[env:soil-sensor]
extends = esp32_base
upload_speed = 921600
lib_ldf_mode = chain+
extra_scripts = post:fix_wifi_deps.py
lib_deps =
    adafruit/Adafruit seesaw Library@^1.7.8
    adafruit/Adafruit SHT4x Library@^1.0.4
    sensirion/Sensirion I2C SCD4x@^0.4.0
    miceuz/I2CSoilMoistureSensor@^1.1.5

[env:scanner]
extends = esp32_base
build_src_filter = -<*> +<../tools/i2c_scanner.cpp>

; ─── Native test environment ────────────────────────────
; Runs unit tests on host (no hardware needed).
; Usage:  pio test -e native
[env:native]
platform = native
build_flags =
    -std=c++17
    -DUNIT_TEST
test_framework = unity
